# Fluent Bit configuration for aircast Pi devices.
#
# Reads the systemd journal for aircast-agent.service, parses slog JSON out of
# MESSAGE, and ships the records to Loki. Credentials and device labels come
# from EnvironmentFile drop-ins managed by aircast-agent (see env.conf).

[SERVICE]
    Flush                       5
    Log_Level                   info
    Daemon                      off
    Parsers_File                parsers.conf
    storage.path                /var/lib/fluent-bit/buffer
    storage.sync                normal
    storage.backlog.mem_limit   16M

[INPUT]
    Name              systemd
    Tag               aircast.*
    Systemd_Filter    _SYSTEMD_UNIT=aircast-agent.service
    Read_From_Tail    On
    DB                /var/lib/fluent-bit/journal.db
    storage.type      filesystem

[FILTER]
    Name           parser
    Match          aircast.*
    Key_Name       MESSAGE
    Parser         json
    Reserve_Data   On
    Preserve_Key   Off

[OUTPUT]
    Name                       loki
    Match                      aircast.*
    Host                       ${LOKI_HOST}
    Port                       443
    TLS                        On
    TLS.Verify                 On
    http_user                  ${LOKI_USERNAME}
    http_passwd                ${LOKI_PASSWORD}
    labels                     app=aircast-agent, device_id=${DEVICE_ID}, device_name=${DEVICE_NAME}, environment=${ENVIRONMENT}, version=${VERSION}, host=${HOST}
    label_keys                 $level,$component,$provider
    line_format                json
    auto_kubernetes_labels     Off
    # Filesystem-backed retry buffer. The systemd input declares
    # storage.type=filesystem, so backlog chunks waiting on a Loki retry
    # already persist under /var/lib/fluent-bit/buffer. The limit below
    # caps how much disk that backlog can consume — picked to bound use
    # on Pis with small SD cards while holding ~hours of normal volume.
    storage.total_limit_size   32M
