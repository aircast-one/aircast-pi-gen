# Fluent Bit parsers for aircast Pi devices.
#
# The json parser's Time_Format matches Go's slog default (RFC3339Nano with a
# numeric timezone offset), so we lift the slog "time" field into the record
# timestamp Loki sees.

[PARSER]
    Name        json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
