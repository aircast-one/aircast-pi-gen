# Initial radio settings. aircastd regenerates this file whole whenever the
# channel, region or transmit power is changed from the device UI, so edits
# here survive only until the first save. The values below are what aircastd
# renders for an unconfigured device, so nothing jumps on that first save.

[common]
wifi_channel = 165     # 5825 MHz. Must match the ground station exactly.
wifi_region = 'BO'     # CRDA region. BO permits the highest tx power.

[drone_video]
# aircastd writes RTP here. This address is the contract between the two:
# it is what media.DefaultWFBAddress offers on the camera page.
peer = 'listen://0.0.0.0:5602'

[drone_mavlink]
peer = 'listen://0.0.0.0:14560'
