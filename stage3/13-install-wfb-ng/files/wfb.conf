# The stock realtek modules claim the adapter before the wfb-patched one can.
# Without this the card comes up as an ordinary station and never reaches
# monitor mode.
blacklist 88XXau
blacklist 8812au
blacklist 8812

# TX power is left at the driver default on purpose: the legal ceiling and the
# thermal headroom are both airframe-specific. To raise it, set
# rtw_tx_pwr_idx_override (0-30, higher is more power) and reboot.
#options 88XXau_wfb rtw_tx_pwr_idx_override=30
