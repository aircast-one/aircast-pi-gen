name: Build and Release Pi Images

permissions:
  contents: write
  pull-requests: write
  issues: write
  repository-projects: write

on:
  # The image owns its own version line; `just release <type>` pushes the tag.
  push:
    tags:
      - 'v*'

  # Rebuild an already-tagged image (emergency / changed aircastd pin)
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to rebuild (e.g. v1.0.0, v1.0.0-dev.1)'
        required: true
        type: string
      aircastd_version:
        description: 'aircastd version to pin (empty = newest in the channel)'
        required: false
        type: string

# The runner box has two runner slots sharing one docker daemon, and the build
# uses a fixed container name (pigen_work) plus daemon-wide cleanup steps — two
# release builds running at once would docker-rm each other's containers
# mid-build. Serialize them.
concurrency:
  group: pi-image-build
  cancel-in-progress: false

env:
  IMG_NAME: aircast-rpi-arm64

jobs:
  prepare:
    runs-on: [self-hosted, Linux]
    outputs:
      version: ${{ steps.version.outputs.version }}
      distribution: ${{ steps.version.outputs.distribution }}
      environment: ${{ steps.version.outputs.environment }}
      aircastd_version: ${{ steps.version.outputs.aircastd_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version and distribution
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            AIRCASTD_VERSION="${{ inputs.aircastd_version }}"
            git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1 || {
              echo "[ERROR] Tag $VERSION does not exist. Cut it with \`just release <type>\`."
              exit 1
            }
          else
            VERSION="${{ github.ref_name }}"
            AIRCASTD_VERSION=""
          fi

          # The tag suffix is the single source of truth for the channel, so the
          # image can't be published to one channel while numbered for another.
          if   [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]];   then DISTRIBUTION="development"
          elif [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-stage\.[0-9]+$ ]]; then DISTRIBUTION="staging"
          elif [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]];    then DISTRIBUTION="testing"
          elif [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]];               then DISTRIBUTION="stable"
          else
            echo "[ERROR] Invalid tag format: $VERSION"
            echo "Expected: v1.0.0, v1.0.0-rc.1, v1.0.0-stage.1, or v1.0.0-dev.1"
            exit 1
          fi

          # Set environment based on distribution
          case "$DISTRIBUTION" in
            "development"|"staging")
              ENVIRONMENT="development"
              ;;
            *)
              ENVIRONMENT="production"
              ;;
          esac

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "distribution=$DISTRIBUTION" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "aircastd_version=$AIRCASTD_VERSION" >> $GITHUB_OUTPUT
          echo "Building $VERSION for $DISTRIBUTION channel (env: $ENVIRONMENT)"

  build:
    needs: prepare
    runs-on: [self-hosted, Linux]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://cb3f7d95c2d311b22c4e57e0759d3a13.r2.cloudflarestorage.com
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required

    environment: ${{ needs.prepare.outputs.environment }}
    outputs:
      # Versioned artifact name incl. its compression extension (e.g. .img.xz),
      # derived from the actual built file so release/mirror never hardcode it
      # and a future DEPLOY_COMPRESSION change can't drift the extension.
      image_name: ${{ steps.artifacts.outputs.image_name }}

    steps:
      - name: Pre-cleanup (remove leftover work directories)
        run: |
          # Clean up any leftover work directories from previous builds
          # These contain root-owned files that would cause checkout to fail
          if [ -d "work" ]; then
            echo "Found leftover work directory, cleaning up..."
            sudo rm -rf work/
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.version }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=60 update
          sudo apt-get -o DPkg::Lock::Timeout=60 install -y \
            coreutils quilt parted qemu-user-static debootstrap zerofree zip \
            dosfstools libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc \
            gpg pigz xxd arch-test bmap-tools zstd

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Ensure apt-cacher-ng proxy
        id: apt-proxy
        run: |
          # A fresh runner box has no apt cache volume yet: seed it from the
          # R2 copy so the first build there still hits the package cache.
          if ! docker volume inspect apt-cacher-ng-cache >/dev/null 2>&1; then
            if aws s3 cp s3://aircast-ci-cache/pi-gen-cache/apt-cacher-ng.tar.zst apt-cache.tar.zst --no-progress 2>/dev/null; then
              docker volume create apt-cacher-ng-cache
              MP=$(docker volume inspect -f '{{.Mountpoint}}' apt-cacher-ng-cache)
              sudo tar -I zstd -xf apt-cache.tar.zst -C "$MP"
              rm -f apt-cache.tar.zst
              echo "Seeded apt cache volume from R2"
            fi
          fi

          docker start apt-cacher-ng 2>/dev/null || \
            docker run -d --name apt-cacher-ng --restart unless-stopped \
              -p 3142:3142 -v apt-cacher-ng-cache:/var/cache/apt-cacher-ng \
              sameersbn/apt-cacher-ng:3.7.4-20220421 || true

          # 172.17.0.1 is the docker0 bridge IP: the only host address the
          # pi-gen container (and the chroot inside it) can always reach.
          PROXY_URL="http://172.17.0.1:3142"
          for _ in $(seq 1 10); do
            # Same reachability semantics as build.sh's own APT_PROXY check
            # (plain curl, any HTTP response counts).
            if curl -sm 2 "$PROXY_URL" -o /dev/null; then
              echo "url=$PROXY_URL" >> "$GITHUB_OUTPUT"
              echo "apt-cacher-ng reachable at $PROXY_URL - apt downloads will be cached"
              exit 0
            fi
            sleep 1
          done
          # Empty APT_PROXY means "no proxy" to build.sh, so a broken cacher
          # degrades to an uncached build instead of failing the release.
          echo "url=" >> "$GITHUB_OUTPUT"
          echo "[WARN] apt-cacher-ng not reachable - building without apt cache"

      - name: Create build configuration
        run: |
          echo "Creating build configuration..."
          cat > config << EOF
          IMG_NAME='aircast-rpi-arm64'
          ENABLE_SSH=1
          FIRST_USER_NAME=pi
          FIRST_USER_PASS=raspberry
          DISABLE_FIRST_BOOT_USER_RENAME=1
          STAGE_LIST="stage0 stage1 stage2 stage3"
          RELEASE=trixie
          TARGET_HOSTNAME=aircast
          WPA_COUNTRY=GE
          PIGEN_DOCKER_OPTS="--dns 8.8.8.8 --dns 8.8.4.4"
          DEPLOY_COMPRESSION=xz
          APT_PROXY='${{ steps.apt-proxy.outputs.url }}'
          # Exported so stage3 sees them: the apt channel to pull aircastd from,
          # the exact version to pin (empty = channel-latest), and the provenance
          # baked into /etc/aircast-release.json.
          export AIRCAST_DISTRIBUTION='${{ needs.prepare.outputs.distribution }}'
          export AIRCASTD_VERSION='${{ needs.prepare.outputs.aircastd_version }}'
          export IMAGE_VERSION='${{ needs.prepare.outputs.version }}'
          export PI_GEN_REF='${{ needs.prepare.outputs.version }}'
          export PI_GEN_COMMIT="$(git rev-parse --short HEAD)"
          EOF

          echo "Configuration created"

      - name: Restore base cache from R2 (stages 0-2)
        id: cache-setup
        env:
          # Bump to force a fresh base bake fleet-wide without touching stage files.
          CACHE_VERSION: "1"
        run: |
          set -euo pipefail
          WORK_DIR="work/${{ env.IMG_NAME }}"

          # Cache key: a content hash of everything that shapes the base rootfs
          # (stages 0-2 + the bootstrap machinery), but NOT stage3 or the generated
          # `config` (which carries the per-release version/channel). So editing
          # stage3 or cutting a new release keeps the key stable and hits the cache;
          # only a base change re-bakes. RELEASE is pinned to the value in `config`.
          CACHE_KEY=$( {
            # scripts/release*.sh are tag-cutting tooling with no effect on the
            # rootfs; hashing them rotated the key on test-only commits.
            find stage0 stage1 stage2 scripts export-image export-noobs Dockerfile depends \
              -type f -not -name 'release.sh' -not -name 'release_test.sh' \
              -exec sha256sum {} + 2>/dev/null
            echo "RELEASE=trixie"
            echo "CACHE_VERSION=${CACHE_VERSION}"
          } | LC_ALL=C sort | sha256sum | cut -c1-32 )
          CACHE_OBJ="s3://aircast-ci-cache/pi-gen-cache/${{ env.IMG_NAME }}/${CACHE_KEY}.tar.zst"
          echo "cache_obj=$CACHE_OBJ" >> "$GITHUB_OUTPUT"
          echo "Base cache key: $CACHE_KEY"
          echo "Base cache object: $CACHE_OBJ"

          mkdir -p "$WORK_DIR"
          if aws s3 cp "$CACHE_OBJ" cache.tar.zst --no-progress 2>/dev/null; then
            echo "Base cache HIT - restoring stages 0-2 and skipping their rebuild"
            # -p/--numeric-owner: rootfs files carry assorted UIDs (e.g. pi=1000); sudo to write them.
            sudo tar -I zstd -xpf cache.tar.zst -C "$WORK_DIR" --numeric-owner
            rm -f cache.tar.zst
            # pi-gen skips a stage's scripts (and its prerun) when a SKIP file exists
            # in the stage dir (build.sh), reusing the restored work/IMG_NAME/stageN/rootfs.
            touch stage0/SKIP stage1/SKIP stage2/SKIP
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "Base cache MISS - running a full build; stages 0-2 will be uploaded afterward"
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up Docker containers
        run: |
          echo "Cleaning up any existing Docker containers..."
          docker rm -f pigen_work 2>/dev/null || true
          docker rm -f pigen_work_cont 2>/dev/null || true
          echo "Container cleanup completed"

      - name: Build Pi image with Docker
        env:
          PRESERVE_CONTAINER: 1
        run: |
          echo "Starting Docker-based build..."
          echo "Cache status: ${{ steps.cache-setup.outputs.cache_hit }}"

          # build-docker.sh auto-detects cached stages and handles incremental builds
          ./build-docker.sh

          echo "Build completed successfully!"

      - name: Save base cache to R2 (stages 0-2)
        # Only on a miss: a hit reused the identical, already-uploaded base, so
        # stages 0-2 are byte-for-byte the cached ones and re-uploading is wasted work.
        if: success() && steps.cache-setup.outputs.cache_hit == 'false'
        run: |
          set -euo pipefail
          WORK_DIR="work/${{ env.IMG_NAME }}"
          CACHE_OBJ="${{ steps.cache-setup.outputs.cache_obj }}"

          for stage in stage0 stage1 stage2; do
            if [ ! -d "$WORK_DIR/$stage/rootfs" ]; then
              echo "ERROR: $WORK_DIR/$stage/rootfs missing - build did not persist work/ to the host."
              echo "Check that build-docker.sh bind-mounts work/. Skipping cache upload."
              exit 0
            fi
          done

          echo "Archiving base stages 0-2 (preserving ownership)..."
          # -p/--numeric-owner so rootfs UIDs round-trip; sudo to read root-owned files.
          sudo tar -I 'zstd -T0 -3' -cpf cache.tar.zst -C "$WORK_DIR" --numeric-owner stage0 stage1 stage2
          echo "  Archive size: $(du -sh cache.tar.zst | cut -f1)"
          echo "Uploading to $CACHE_OBJ ..."
          aws s3 cp cache.tar.zst "$CACHE_OBJ" --no-progress
          rm -f cache.tar.zst
          echo "Base cache uploaded - subsequent builds on any runner will skip stages 0-2."

      - name: Save apt cache to R2
        # Best-effort: a failed cache upload must never fail a release.
        if: success() && steps.apt-proxy.outputs.url != ''
        continue-on-error: true
        run: |
          MP=$(docker volume inspect -f '{{.Mountpoint}}' apt-cacher-ng-cache)
          # zstd -1: the cached .debs are already compressed, higher levels
          # only burn CPU. --warning=no-file-changed because apt-cacher-ng
          # stays running while we archive; its exit 1 for changed files is
          # tolerated, anything worse aborts (and is swallowed by
          # continue-on-error above).
          sudo tar -I 'zstd -T0 -1' --warning=no-file-changed \
            -cf apt-cache.tar.zst -C "$MP" . || [ $? -eq 1 ]
          echo "apt cache archive: $(du -sh apt-cache.tar.zst | cut -f1)"
          aws s3 cp apt-cache.tar.zst s3://aircast-ci-cache/pi-gen-cache/apt-cacher-ng.tar.zst --no-progress
          rm -f apt-cache.tar.zst

      - name: Build Statistics
        if: always()
        run: |
          echo "Build Statistics:"
          echo "==================="

          # Check cache hit rate and estimate time savings
          if [ "${{ steps.cache-setup.outputs.cache_hit }}" == "true" ]; then
            echo "Build type: INCREMENTAL (R2 base cache hit; stages 0-2 reused)"
            echo "Estimated time saved: ~30-40 minutes"
          else
            echo "Build type: FULL (base cache miss; stages 0-2 uploaded to R2)"
          fi

          # Show stage sizes (pi-gen uses work/IMG_NAME/stage* structure)
          WORK_DIR="work/${{ env.IMG_NAME }}"
          echo ""
          echo "Stage sizes:"
          for stage in stage0 stage1 stage2 stage3; do
            if [ -d "$WORK_DIR/$stage" ]; then
              SIZE=$(sudo du -sh "$WORK_DIR/$stage" 2>/dev/null | cut -f1 || echo "N/A")
              SKIP=""
              # SKIP markers live in the repo stage dir (build.sh checks there).
              [ -f "$stage/SKIP" ] && SKIP=" (skipped)"
              echo "  - $stage: $SIZE$SKIP"
            fi
          done

          # Show build logs
          if [ -f deploy/build-docker.log ]; then
            echo ""
            echo "Build time:"
            grep -E "real|user|sys" deploy/build-docker.log | tail -3 || true
          fi

      - name: Prepare artifacts
        id: artifacts
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # Find the generated image
          IMAGE_PATH=$(find deploy -name "*.zip" -o -name "*.img" -o -name "*.img.gz" -o -name "*.img.xz" | head -n 1)

          if [ -z "$IMAGE_PATH" ]; then
            echo "No image found in deploy directory"
            exit 1
          fi

          echo "Found image: $IMAGE_PATH"

          # Get the file extension (handle compound extensions like .img.xz)
          FILENAME=$(basename "$IMAGE_PATH")
          if [[ "$FILENAME" == *.img.xz ]]; then
            EXT="img.xz"
          elif [[ "$FILENAME" == *.img.gz ]]; then
            EXT="img.gz"
          elif [[ "$FILENAME" == *.img ]]; then
            EXT="img"
          else
            EXT="${FILENAME##*.}"
          fi

          # Rename to include version
          NEW_NAME="aircast-lite-arm64-${VERSION}.${EXT}"
          cp "$IMAGE_PATH" "$NEW_NAME"

          echo "image_path=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "image_name=$NEW_NAME" >> $GITHUB_OUTPUT

          # Create checksums
          sha256sum "$NEW_NAME" > "${NEW_NAME}.sha256"

          echo "Prepared artifact: $NEW_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pi-image
          path: |
            ${{ steps.artifacts.outputs.image_path }}
            ${{ steps.artifacts.outputs.image_path }}.sha256

      - name: Cleanup build artifacts
        if: always()
        run: |
          echo "Cleaning up build artifacts to free disk space..."
          echo "Note: the incremental base cache lives in R2, so work/ is safe to remove"

          # Remove pi-gen work directory (9GB+). The base stages were already
          # archived to R2 by the "Save base cache" step; this is just scratch.
          if [ -d "work" ]; then
            echo "Removing work directory..."
            sudo rm -rf work/
            echo "  Work directory removed"
          fi

          # Remove deploy directory (build outputs already uploaded)
          if [ -d "deploy" ]; then
            echo "Removing deploy directory..."
            rm -rf deploy/
            echo "  Deploy directory removed"
          fi

          # Stop and remove pi-gen container
          echo "Cleaning up Docker containers..."
          docker rm -f pigen_work 2>/dev/null && echo "  Removed pigen_work container" || true
          docker rm -f pigen_work_cont 2>/dev/null && echo "  Removed pigen_work_cont container" || true

          # Remove dangling Docker volumes (pi-gen creates anonymous volumes)
          echo "Cleaning up Docker volumes..."
          DANGLING_VOLUMES=$(docker volume ls -qf dangling=true)
          if [ -n "$DANGLING_VOLUMES" ]; then
            docker volume rm $DANGLING_VOLUMES 2>/dev/null && echo "  Removed dangling volumes" || true
          fi

          # Prune unused Docker resources (excludes named volumes used by other services)
          echo "Pruning unused Docker resources..."
          docker system prune -f 2>/dev/null || true

          # Show disk usage after cleanup
          echo ""
          echo "Disk usage after cleanup:"
          df -h / | tail -1

          echo "[OK] Cleanup completed"

  release:
    needs: [prepare, build]
    runs-on: [self-hosted, Linux]
    environment: ${{ needs.prepare.outputs.environment }}

    steps:
      - name: Clean workspace
        run: |
          # Self-hosted runner: remove any leftover artifacts from previous runs
          # so globs and downloads only see files from the current build.
          rm -f aircast-lite-arm64-* *.img *.img.xz *.img.gz *.zip *.sha256 || true

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: pi-image
          path: release-assets

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Aircast Lite Image ${{ needs.prepare.outputs.version }}
          body: |
            ## Aircast Raspberry Pi Image

            **Channel:** ${{ needs.prepare.outputs.distribution }}

            ### Installation
            1. Download the image file
            2. Flash it to an SD card using Raspberry Pi Imager or similar tool
            3. Insert the SD card into your Raspberry Pi and boot

            ### Default Credentials
            - Username: `pi`
            - Password: `raspberry`
            - Hostname: `aircast`

            **Important**: Please change the default password after first login!

            ### Checksums
            SHA256 checksums are provided for verification.
          draft: false
          prerelease: ${{ needs.prepare.outputs.distribution != 'stable' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/${{ needs.build.outputs.image_name }}
            release-assets/${{ needs.build.outputs.image_name }}.sha256

  mirror-to-s3:
    needs: [prepare, build, release]
    if: needs.release.result == 'success'
    runs-on: [self-hosted, Linux]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://cb3f7d95c2d311b22c4e57e0759d3a13.r2.cloudflarestorage.com
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required

    steps:
      - name: Wait for GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          ASSET="${{ needs.build.outputs.image_name }}"
          echo "Waiting for release asset $ASSET to be available..."
          for i in $(seq 1 60); do
            if gh release view "$VERSION" -R "${{ github.repository }}" \
                --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
              echo "Release asset available after $i attempt(s)"
              exit 0
            fi
            echo "Attempt $i/60: asset not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "[ERROR] Release asset $ASSET did not become available in time"
          exit 1

      - name: Download and mirror release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          DISTRIBUTION="${{ needs.prepare.outputs.distribution }}"
          echo "Fetching release assets for $VERSION ($DISTRIBUTION)..."

          # Get release info
          RELEASE_INFO=$(gh api repos/${{ github.repository }}/releases/tags/$VERSION)
          RELEASE_ID=$(echo "$RELEASE_INFO" | jq -r '.id')
          RELEASE_URL=$(echo "$RELEASE_INFO" | jq -r '.html_url')
          RELEASE_BODY=$(echo "$RELEASE_INFO" | jq -r '.body')
          CREATED_AT=$(echo "$RELEASE_INFO" | jq -r '.created_at')

          echo "Found release: $RELEASE_URL"

          # Create clean temp directory for downloads
          # Self-hosted runner: ensure no stale files from previous runs
          rm -rf temp-assets
          mkdir -p temp-assets
          cd temp-assets

          # Download only assets matching the current version.
          # Pattern matching guards against any stale assets that might have been
          # attached to this release by earlier failed/partial runs.
          echo "Downloading release assets for $VERSION..."
          gh release download "$VERSION" -R ${{ github.repository }} \
            --pattern "${{ needs.build.outputs.image_name }}" \
            --pattern "${{ needs.build.outputs.image_name }}.sha256"

          # Upload to R2 (one bucket per channel)
          S3_PATH="s3://aircast-artifacts-$DISTRIBUTION/lite"
          echo "Uploading to R2 ($S3_PATH)..."

          # Determine downloads domain based on distribution
          # Each channel is its own R2 bucket served at the domain root,
          # so URLs don't include the distribution in the path
          case "$DISTRIBUTION" in
            "development")
              DOWNLOADS_DOMAIN="downloads-dev.aircast.one"
              ;;
            "staging")
              DOWNLOADS_DOMAIN="downloads.stage.aircast.one"
              ;;
            *)
              DOWNLOADS_DOMAIN="downloads.aircast.one"
              ;;
          esac
          URL_PATH="lite"

          # Upload all image files and checksums with verification
          UPLOAD_FAILED=false
          for file in aircast-lite-arm64-*; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              LOCAL_SIZE=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file")

              # Upload with checksum verification
              if ! aws s3 cp "$file" "$S3_PATH/$VERSION/$file"; then
                echo "[ERROR] Failed to upload $file"
                UPLOAD_FAILED=true
                continue
              fi

              # Verify upload by checking file exists and size matches
              REMOTE_SIZE=$(aws s3api head-object --bucket "aircast-artifacts-$DISTRIBUTION" --key "lite/$VERSION/$file" --query 'ContentLength' --output text 2>/dev/null || echo "0")
              if [ "$LOCAL_SIZE" != "$REMOTE_SIZE" ]; then
                echo "[ERROR] Size mismatch for $file: local=$LOCAL_SIZE, remote=$REMOTE_SIZE"
                UPLOAD_FAILED=true
              else
                echo "[OK] Verified: $file ($LOCAL_SIZE bytes)"
              fi
            fi
          done

          if [ "$UPLOAD_FAILED" = true ]; then
            echo "[ERROR] One or more uploads failed verification"
            exit 1
          fi

          # Update releases.json (single source of truth for all versions)
          echo "Updating releases.json..."

          # Select the image by exact version match — never by filesystem sort/size,
          # which is fragile if stale files are ever present.
          MAIN_IMAGE="${{ needs.build.outputs.image_name }}"
          if [ ! -f "$MAIN_IMAGE" ]; then
            echo "[ERROR] Expected image file not found: $MAIN_IMAGE"
            ls -la aircast-lite-arm64-* 2>/dev/null || true
            exit 1
          fi

          IMAGE_SIZE=$(stat -f%z "$MAIN_IMAGE" 2>/dev/null || stat -c%s "$MAIN_IMAGE")

          # Extract extension using pattern matching
          if [[ "$MAIN_IMAGE" == *.img.xz ]]; then
            IMAGE_EXTENSION="img.xz"
          elif [[ "$MAIN_IMAGE" == *.img.gz ]]; then
            IMAGE_EXTENSION="img.gz"
          elif [[ "$MAIN_IMAGE" == *.img ]]; then
            IMAGE_EXTENSION="img"
          elif [[ "$MAIN_IMAGE" == *.zip ]]; then
            IMAGE_EXTENSION="zip"
          else
            IMAGE_EXTENSION="${MAIN_IMAGE##*.}"
          fi

          if [ -z "$IMAGE_EXTENSION" ]; then
            echo "[ERROR] Failed to extract extension from: $MAIN_IMAGE"
            exit 1
          fi

          # Validate checksum file exists (should always be generated in Prepare artifacts step)
          CHECKSUM_FILE="${MAIN_IMAGE}.sha256"
          if [ ! -f "$CHECKSUM_FILE" ]; then
            echo "[ERROR] Checksum file not found: $CHECKSUM_FILE"
            exit 1
          fi

          echo "Image: $MAIN_IMAGE (extension: $IMAGE_EXTENSION, size: $IMAGE_SIZE)"

          # Fetch existing releases.json from R2 directly (bypass CDN cache)
          S3_KEY="lite/releases.json"

          if aws s3 cp "s3://aircast-artifacts-$DISTRIBUTION/$S3_KEY" existing-releases.json 2>/dev/null; then
            echo "Found existing releases.json"
          else
            echo "No existing releases.json, creating new"
            echo '{"releases":[]}' > existing-releases.json
          fi

          # Create new release entry using jq (no heredoc indentation issues)
          jq -n \
            --arg version "$VERSION" \
            --argjson prerelease "${{ needs.prepare.outputs.distribution != 'stable' }}" \
            --arg created_at "$CREATED_AT" \
            --arg filename "$MAIN_IMAGE" \
            --arg extension "$IMAGE_EXTENSION" \
            --argjson size "$IMAGE_SIZE" \
            --arg download_url "https://$DOWNLOADS_DOMAIN/$URL_PATH/$VERSION/$MAIN_IMAGE" \
            --arg checksum_url "https://$DOWNLOADS_DOMAIN/$URL_PATH/$VERSION/$CHECKSUM_FILE" \
            '{
              version: $version,
              prerelease: $prerelease,
              created_at: $created_at,
              image: {
                filename: $filename,
                extension: $extension,
                size: $size,
                download_url: $download_url,
                checksum_url: $checksum_url
              }
            }' > new-release.json

          jq --slurpfile new new-release.json '
            def semver_key:
              (.version | ltrimstr("v") | split("-")) as $parts
              | ($parts[0] | split(".") | map(tonumber)) as $core
              | (if ($parts | length) > 1
                 then [0, ($parts[1:] | join("-") | split(".") | map(tonumber? // .))]
                 else [1, []] end) as $pre
              | [$core[0], $core[1], $core[2], $pre[0], $pre[1]];
            .releases = ([$new[0]] + [.releases[] | select(.version != $new[0].version)]
                         | sort_by(semver_key)
                         | reverse)
          ' existing-releases.json > releases.json

          echo "Updated releases.json with $VERSION (total: $(jq '.releases | length' releases.json) releases)"

          # Upload with retry on race condition
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if ! aws s3 cp releases.json "$S3_PATH/releases.json"; then
              echo "[ERROR] Failed to upload releases.json"
              exit 1
            fi

            # Verify upload succeeded by checking the file exists
            if aws s3api head-object --bucket "aircast-artifacts-$DISTRIBUTION" --key "$S3_KEY" > /dev/null 2>&1; then
              echo "[OK] releases.json uploaded successfully"
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "[WARN] Upload verification failed, retry $RETRY_COUNT/$MAX_RETRIES"
            sleep 2
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "[ERROR] Failed to verify releases.json upload after $MAX_RETRIES retries"
            exit 1
          fi

          echo "[OK] releases.json updated: $S3_PATH/releases.json"
          echo "[OK] Mirror complete!"
          echo "Mirror URL: https://$DOWNLOADS_DOMAIN/$URL_PATH/$VERSION/"

          cd ..
          rm -rf temp-assets


  notify:
    needs: [prepare, build, release, mirror-to-s3]
    if: always()
    runs-on: [self-hosted, Linux]

    steps:
      - name: Generate build summary
        run: |
          DISTRIBUTION="${{ needs.prepare.outputs.distribution }}"

          echo "## Raspberry Pi Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name == 'push' && 'Tag push' || 'Manual rebuild' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Distribution:** $DISTRIBUTION" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Build:** ${{ needs.build.result == 'success' && 'Success' || 'Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release:** ${{ needs.release.result == 'success' && 'Success' || needs.release.result == 'skipped' && 'Skipped' || 'Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **R2 Mirror:** ${{ needs.mirror-to-s3.result == 'success' && 'Success' || needs.mirror-to-s3.result == 'skipped' && 'Skipped' || 'Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Determine downloads domain based on distribution
          case "$DISTRIBUTION" in
            "development")
              DOWNLOADS_DOMAIN="downloads-dev.aircast.one"
              ;;
            "staging")
              DOWNLOADS_DOMAIN="downloads.stage.aircast.one"
              ;;
            *)
              DOWNLOADS_DOMAIN="downloads.aircast.one"
              ;;
          esac
          URL_PATH="lite"

          if [ "${{ needs.release.result }}" == "success" ]; then
            echo "### Release Published" >> $GITHUB_STEP_SUMMARY
            echo "- **GitHub Release:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.mirror-to-s3.result }}" == "success" ]; then
              echo "- **R2 Mirror:** https://$DOWNLOADS_DOMAIN/$URL_PATH/${{ needs.prepare.outputs.version }}/" >> $GITHUB_STEP_SUMMARY
              echo "- **Releases:** https://$DOWNLOADS_DOMAIN/$URL_PATH/releases.json" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check the build logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Telegram
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          DISTRIBUTION="${{ needs.prepare.outputs.distribution }}"
          BUILD="${{ needs.build.result }}"
          RELEASE="${{ needs.release.result }}"
          MIRROR="${{ needs.mirror-to-s3.result }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$BUILD" == "success" ] && [ "$RELEASE" == "success" ]; then
            MESSAGE="✅ *Pi Image Published*

          *Version:* \`${VERSION}\`
          *Channel:* ${DISTRIBUTION}
          *R2 Mirror:* ${MIRROR}"
          else
            MESSAGE="❌ *Pi Image Build Failed*

          *Version:* \`${VERSION}\`
          *Build:* ${BUILD}
          *Release:* ${RELEASE}

          [View Logs](${RUN_URL})"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="$MESSAGE"
