name: Validate

on:
  pull_request:
    paths:
      - 'stage**'
      - 'justfile'
      - '.github/workflows/validate.yml'
  push:
    branches: [lite-arm64]
    paths:
      - 'stage**'
      - 'justfile'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Lint stage script naming
        run: just lint-stage-scripts
